<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ScoutAI</title>
<style>
  :root {
    --bg: #0a0d0a;
    --panel: #10140f;
    --border: #1f2a1d;
    --border-soft: #182217;
    --text: #d6e0d4;
    --muted: #6a7768;
    --dim: #4a5447;
    --green: #b6ff3c;
    --green-track: rgba(182,255,60,0.12);
    --yellow: #f5d34a;
    --red: #ff6b5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1180px; margin: 0 auto; padding: 28px 28px 60px; }

  h1.brand {
    font-size: 48px; font-weight: 700; margin: 0 0 4px;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--green) 0%, #3b82f6 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .accent { height: 2px; width: 72px; background: linear-gradient(90deg, var(--green) 0%, transparent 100%); margin-bottom: 16px; }
  .brand-sub { color: var(--muted); font-size: 12px; letter-spacing: 0.02em; margin-bottom: 24px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 10px 18px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; }
  .tab.active { color: var(--text); border-bottom-color: var(--green); }
  .pane { display: none; }
  .pane.active { display: block; }

  .form-card { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 18px; }
  .form-card label { display: block; color: var(--muted); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; margin-top: 14px; margin-bottom: 6px; }
  .form-card label:first-child { margin-top: 0; }
  .form-card input, .form-card select, .form-card textarea {
    width: 100%; background: #0c100b; border: 1px solid var(--border); color: var(--text);
    padding: 9px 11px; border-radius: 3px; font-family: inherit; font-size: 13px;
  }
  .form-card textarea { min-height: 90px; resize: vertical; }
  .form-card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn-primary {
    margin-top: 16px; background: linear-gradient(135deg, var(--green) 0%, #82bf25 100%);
    color: #0a0d0a; border: 0; padding: 10px 18px; border-radius: 4px; font-weight: 700;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; width: 100%;
  }
  .btn-primary:hover { filter: brightness(1.08); }

  .status { color: var(--muted); font-style: italic; padding: 12px 0; }
  .status.error { color: var(--red); font-style: normal; }

  .sign-badge { display: inline-flex; align-items: center; gap: 12px; border: 1.5px solid var(--green); color: var(--green); padding: 10px 18px; border-radius: 3px; margin-bottom: 14px; }
  .sign-badge.monitor { border-color: var(--yellow); color: var(--yellow); }
  .sign-badge.pass { border-color: var(--red); color: var(--red); }
  .sign-badge .word { font-size: 18px; font-weight: 700; letter-spacing: 0.18em; }

  .lqi { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 16px 20px 22px; margin-bottom: 16px; }
  .lqi-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 9.5px; letter-spacing: 0.22em; color: var(--muted); margin-bottom: 14px; }
  .lqi-bar { position: relative; height: 4px; background: var(--border-soft); border-radius: 2px; }
  .lqi-bar .fill { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(to right, rgba(182,255,60,0), var(--green)); border-radius: 2px; }
  .lqi-bar .marker { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--green); transform: translate(-50%, -50%); box-shadow: 0 0 0 3px rgba(182,255,60,0.18); }
  .lqi-foot { display: flex; justify-content: space-between; margin-top: 12px; font-size: 11px; color: var(--muted); }
  .lqi-foot strong { color: var(--green); font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 18px; overflow: hidden; }
  .stat { padding: 14px 14px 16px; border-right: 1px solid var(--border-soft); }
  .stat:last-child { border-right: none; }
  .stat .label { font-size: 9px; letter-spacing: 0.18em; color: var(--muted); margin-bottom: 8px; }
  .stat .value { font-size: 22px; font-weight: 600; color: var(--text); }
  .stat .sub { font-size: 10px; color: var(--dim); margin-top: 4px; }

  .adj-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .adj-table th { text-align: right; font-size: 9px; letter-spacing: 0.18em; color: var(--muted); padding: 6px 0 10px; border-bottom: 1px solid var(--border-soft); }
  .adj-table th:first-child { text-align: left; }
  .adj-table th.proj { color: var(--green); }
  .adj-table td { padding: 11px 0; border-bottom: 1px solid var(--border-soft); text-align: right; }
  .adj-table td:first-child { text-align: left; color: var(--muted); }
  .adj-table td.proj { color: var(--green); font-weight: 600; }
  .adj-table tr:last-child td { border-bottom: none; }

  .panel-block { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 20px; margin-bottom: 18px; }
  .panel-title { font-size: 10px; letter-spacing: 0.22em; color: var(--text); font-weight: 600; margin-bottom: 14px; text-transform: uppercase; }

  .report-text { color: #c1cabd; font-size: 13px; line-height: 1.65; }
  .report-text h1, .report-text h2, .report-text h3 { color: var(--text); margin-top: 18px; margin-bottom: 8px; }
  .report-text h1 { font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--green); }
  .report-text h2 { font-size: 14px; }
  .report-text h3 { font-size: 13px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .report-text strong { color: var(--text); }
  .report-text ul { padding-left: 18px; }

  table.candidates { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.candidates th { text-align: left; font-size: 9px; letter-spacing: 0.18em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
  table.candidates td { padding: 10px; border-bottom: 1px solid var(--border-soft); }
  table.candidates td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.candidates tr:last-child td { border-bottom: none; }
</style>
</head>
<body>
<div class="container">

  <h1 class="brand">ScoutAI</h1>
  <div class="accent"></div>
  <div class="brand-sub">International soccer scouting, powered by Claude.</div>

  <div class="tabs">
    <div class="tab active" data-pane="scout">Scouting Report</div>
    <div class="tab" data-pane="discover">Find Players</div>
  </div>

  <!-- SCOUT PANE -->
  <div class="pane active" id="pane-scout">
    <div class="form-card">
      <label for="scout-name">Player Name</label>
      <input id="scout-name" type="text" placeholder="e.g. Pedro Rocha">
      <label for="scout-league">League</label>
      <select id="scout-league">
        {% for league in leagues %}<option value="{{ league }}">{{ league }}</option>{% endfor %}
      </select>
      <label for="scout-stats">Stats (optional)</label>
      <textarea id="scout-stats" placeholder="Goals, assists, appearances..."></textarea>
      <button class="btn-primary" id="scout-btn">Generate Scouting Report</button>
    </div>
    <div id="scout-status"></div>
    <div id="scout-report"></div>
  </div>

  <!-- DISCOVER PANE -->
  <div class="pane" id="pane-discover">
    <div class="form-card">
      <div class="row">
        <div>
          <label for="discover-league">League</label>
          <select id="discover-league">
            {% for league in discovery_leagues %}<option value="{{ league }}">{{ league }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label for="discover-position">Position</label>
          <select id="discover-position">
            <option>Striker</option><option>Midfielder</option><option>Defender</option><option>Goalkeeper</option>
          </select>
        </div>
      </div>
      <label for="discover-target">Target Level</label>
      <select id="discover-target">
        <option>MLS</option><option>USL Championship</option><option>USL League One</option>
      </select>
      <button class="btn-primary" id="discover-btn">Find Players</button>
    </div>
    <div id="discover-status"></div>
    <div id="discover-results"></div>
  </div>

</div>

<script>
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function renderMarkdown(md) {
  if (!md) return "";
  let html = esc(md);
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>");
  html = html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>");
  html = html.split(/\n{2,}/).map(b => b.startsWith("<") ? b : `<p>${b}</p>`).join("");
  return html;
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".pane").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("pane-" + t.dataset.pane).classList.add("active");
  });
});

const verdictClass = v => v === "MONITOR" ? "monitor" : v === "PASS" ? "pass" : "";
const verdictEmoji = v => ({ SIGN: "✅", MONITOR: "⚠️", PASS: "❌" })[v] || "";

function renderScoutResult(league, data) {
  const v = data.verdict;
  const sc = data.league_quality_score || 0;
  const proj = data.projection;
  let html = "";

  if (v) {
    html += `<div class="sign-badge ${verdictClass(v)}"><span class="word">VERDICT: ${esc(v)}</span><span>${verdictEmoji(v)}</span></div>`;
  }

  html += `<div class="lqi">
    <div class="lqi-head"><span>LEAGUE QUALITY INDEX</span><span>1.0 — 10.0</span></div>
    <div class="lqi-bar">
      <div class="fill" style="width:${sc * 10}%"></div>
      <div class="marker" style="left:${sc * 10}%"></div>
    </div>
    <div class="lqi-foot"><span>${esc(league)}</span><strong>${esc(sc)}/10</strong></div>
    <div style="margin-top:8px;font-size:11px;color:var(--muted)">${esc(data.league_label || "")}</div>
  </div>`;

  if (proj) {
    const apps = proj.appearances != null ? proj.appearances : "—";
    const gp90 = proj.goals_per_90 != null ? proj.goals_per_90 : "—";
    html += `<div class="stats">
      <div class="stat"><div class="label">RAW GOALS</div><div class="value">${esc(proj.raw_goals)}</div><div class="sub">${esc(proj.raw_assists || 0)} assists</div></div>
      <div class="stat"><div class="label">ADJUSTMENT</div><div class="value">${esc(proj.goals_factor)}x</div><div class="sub">${esc(proj.label)}</div></div>
      <div class="stat"><div class="label">PROJECTED USL GOALS</div><div class="value">${esc(proj.adjusted_goals)}</div><div class="sub">based on ${esc(apps)} apps</div></div>
      <div class="stat"><div class="label">GOALS / 90 (USL)</div><div class="value">${esc(gp90)}</div><div class="sub">per match equivalent</div></div>
    </div>`;
    html += `<div class="panel-block">
      <div class="panel-title">League Adjustment</div>
      <table class="adj-table">
        <thead><tr><th></th><th>RAW</th><th class="proj">PROJECTED</th></tr></thead>
        <tbody>
          <tr><td>Goals (season)</td><td>${esc(proj.raw_goals)}</td><td class="proj">${esc(proj.adjusted_goals)}</td></tr>
          <tr><td>Assists (season)</td><td>${esc(proj.raw_assists)}</td><td class="proj">${esc(proj.adjusted_assists)}</td></tr>
        </tbody>
      </table>
    </div>`;
  }

  html += `<div class="panel-block">
    <div class="panel-title">Scouting Report</div>
    <div class="report-text">${renderMarkdown(data.report_text)}</div>
  </div>`;

  return html;
}

document.getElementById("scout-btn").addEventListener("click", async () => {
  const name = document.getElementById("scout-name").value.trim();
  const league = document.getElementById("scout-league").value;
  const stats = document.getElementById("scout-stats").value;
  const status = document.getElementById("scout-status");
  const report = document.getElementById("scout-report");
  report.innerHTML = "";
  if (!name) { status.className = "status error"; status.textContent = "Enter a player name."; return; }
  status.className = "status"; status.textContent = "Scouting...";
  try {
    const res = await fetch("/api/scout", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ player_name: name, league, stats }),
    });
    const data = await res.json();
    if (!res.ok) { status.className = "status error"; status.textContent = data.error || "Request failed."; return; }
    status.textContent = "";
    report.innerHTML = renderScoutResult(league, data);
  } catch (e) {
    status.className = "status error";
    status.textContent = String(e);
  }
});

document.getElementById("discover-btn").addEventListener("click", async () => {
  const league = document.getElementById("discover-league").value;
  const position = document.getElementById("discover-position").value;
  const target_level = document.getElementById("discover-target").value;
  const status = document.getElementById("discover-status");
  const results = document.getElementById("discover-results");
  results.innerHTML = "";
  status.className = "status"; status.textContent = "Scouting candidates...";
  try {
    const res = await fetch("/api/discover", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ league, position, target_level }),
    });
    const data = await res.json();
    if (!res.ok) { status.className = "status error"; status.textContent = data.error || "Request failed."; return; }
    const cands = data.candidates || [];
    if (!cands.length) { status.className = "status"; status.textContent = "No candidates returned. Try a different combination."; return; }
    status.textContent = "";
    let html = `<div class="panel-block"><div class="panel-title">Recommended Transfer Targets</div>
      <table class="candidates"><thead><tr>
        <th>Name</th><th>Age</th><th>Club</th><th>Goals</th><th>Assists</th><th>Apps</th><th>Market Value (€)</th><th>USL Fit</th>
      </tr></thead><tbody>`;
    cands.forEach(c => {
      html += `<tr>
        <td>${esc(c.name)}</td>
        <td class="num">${esc(c.age ?? "—")}</td>
        <td>${esc(c.club ?? "—")}</td>
        <td class="num">${esc(c.goals ?? "—")}</td>
        <td class="num">${esc(c.assists ?? "—")}</td>
        <td class="num">${esc(c.appearances ?? "—")}</td>
        <td class="num">${esc(c.market_value_euros ?? "—")}</td>
        <td class="num">${esc(c.usl_fit_score ?? "—")}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    results.innerHTML = html;
  } catch (e) {
    status.className = "status error";
    status.textContent = String(e);
  }
});
</script>
</body>
</html>
